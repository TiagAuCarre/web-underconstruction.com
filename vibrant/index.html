<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site en construction — Vibrant</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #ff5f6d, #ffc371, #ff8a5b, #ff5f9e);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    font-family: 'Poppins', sans-serif;
    padding: 2rem 1rem;
    position: relative;
    overflow: hidden;
  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ===== FORMES FLOTTANTES ===== */
  .shape {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    pointer-events: none;
    z-index: 0;
  }
  .shape-1 { width: 140px; height: 140px; top: 8%; left: 8%; animation: floatShape 8s ease-in-out infinite; }
  .shape-2 { width: 90px; height: 90px; bottom: 12%; left: 14%; animation: floatShape 6s ease-in-out infinite 1s; }
  .shape-3 { width: 180px; height: 180px; top: 15%; right: 8%; animation: floatShape 10s ease-in-out infinite 0.5s; }
  .shape-4 { width: 70px; height: 70px; bottom: 8%; right: 16%; animation: floatShape 7s ease-in-out infinite 1.5s; }
  @keyframes floatShape {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-25px) scale(1.08); }
  }

  .lang-switch {
    position: fixed;
    top: 24px; right: 24px;
    z-index: 5;
    display: flex;
    gap: 0.3rem;
    background: rgba(255,255,255,0.9);
    padding: 0.3rem;
    border-radius: 999px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .lang-switch button {
    border: none;
    background: transparent;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    color: #333;
    transition: 0.2s;
    font-family: 'Poppins', sans-serif;
  }
  .lang-switch button.active {
    background: #ff5f6d;
    color: white;
  }

  .card {
    background: rgba(255,255,255,0.97);
    border-radius: 32px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.25);
    padding: 4rem 3.5rem;
    text-align: center;
    max-width: 540px;
    width: 100%;
    position: relative;
    z-index: 2;
    opacity: 0;
    transform: translateY(30px) scale(0.96);
    animation: popIn 0.7s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  .icon-wrap {
    width: 78px; height: 78px;
    border-radius: 24px;
    background: linear-gradient(135deg, #ff5f6d, #ffc371);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    box-shadow: 0 14px 34px rgba(255,95,109,0.4);
    animation: bounce 2.4s ease-in-out infinite;
  }
  .icon-wrap svg { width: 36px; height: 36px; stroke: white; }

  h1 {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #ff5f6d, #ff8a5b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }

  p.subtitle {
    color: #555;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .dots { display: inline-flex; gap: 6px; margin-left: 4px; vertical-align: middle; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5f6d; opacity: 0; animation: dotPop 1.8s ease-in-out infinite; }
  .dot:nth-child(1){ animation-delay: 0s; }
  .dot:nth-child(2){ animation-delay: 0.3s; }
  .dot:nth-child(3){ animation-delay: 0.6s; }

  .notify {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 28px;
  }
  .notify input {
    flex: 1;
    min-width: 220px;
    background: #fdf1f0;
    border: 1.5px solid transparent;
    border-radius: 999px;
    padding: 13px 20px;
    font-size: 0.92rem;
    font-family: 'Poppins', sans-serif;
    outline: none;
    transition: 0.2s;
    color: #333;
  }
  .notify input:focus { border-color: #ff5f6d; background: white; }
  .notify button {
    background: linear-gradient(135deg, #ff5f6d, #ff8a5b);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 13px 28px;
    font-weight: 800;
    font-size: 0.92rem;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    transition: 0.25s;
  }
  .notify button:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 12px 28px rgba(255,95,109,0.4); }

  .social-row {
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .social-dot {
    width: 42px; height: 42px;
    border-radius: 14px;
    background: #fdf1f0;
    display: flex; align-items: center; justify-content: center;
    transition: 0.25s;
    cursor: pointer;
  }
  .social-dot:hover { background: linear-gradient(135deg, #ff5f6d, #ffc371); transform: translateY(-3px); }
  .social-dot:hover svg { stroke: white; }
  .social-dot svg { width: 18px; height: 18px; stroke: #ff5f6d; transition: 0.25s; }

  @keyframes popIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes bounce { 0%,100%{ transform: translateY(0) rotate(0deg); } 50%{ transform: translateY(-8px) rotate(3deg); } }
  @keyframes dotPop { 0%{opacity:0;transform:scale(0.5)} 40%{opacity:1;transform:scale(1.3)} 60%{transform:scale(1)} 85%{opacity:1} 100%{opacity:0;transform:scale(0.5)} }
</style>
</head>
<body>

<div class="shape shape-1"></div>
<div class="shape shape-2"></div>
<div class="shape shape-3"></div>
<div class="shape shape-4"></div>

<div class="lang-switch">
  <button id="btn-fr" onclick="setLang('fr')">FR</button>
  <button id="btn-en" onclick="setLang('en')">EN</button>
</div>

<div class="card">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
    </svg>
  </div>

  <h1 id="main-title">Ça arrive bientôt<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></h1>
  <p class="subtitle" id="subtitle">On peaufine les derniers détails. Sois le premier informé du lancement !</p>

  <div class="notify">
    <input type="email" id="emailInput" placeholder="ton@email.com">
    <button id="notifyBtn" onclick="notifyMe()">Me prévenir</button>
  </div>

  <div class="social-row">
    <div class="social-dot"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/></svg></div>
    <div class="social-dot"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></div>
    <div class="social-dot"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53A4.48 4.48 0 0 0 22.4 1.5a9 9 0 0 1-2.83 1.08A4.52 4.52 0 0 0 11.5 6c0 .35.04.7.11 1.03A12.8 12.8 0 0 1 3 2.3a4.5 4.5 0 0 0 1.4 6.05A4.4 4.4 0 0 1 2.4 7.7v.06a4.52 4.52 0 0 0 3.6 4.43 4.5 4.5 0 0 1-2 .08 4.52 4.52 0 0 0 4.22 3.14A9.05 9.05 0 0 1 1 17.54 12.75 12.75 0 0 0 7.9 19.5c8.3 0 12.85-6.87 12.85-12.83 0-.2 0-.39-.01-.58A9.2 9.2 0 0 0 23 3z"/></svg></div>
  </div>
</div>

<script>
const content = {
  fr: {
    title: "Ça arrive bientôt",
    subtitle: "On peaufine les derniers détails. Sois le premier informé du lancement !",
    placeholder: "ton@email.com",
    btn: "Me prévenir",
    done: "✓ C'est noté !"
  },
  en: {
    title: "Coming soon",
    subtitle: "We're polishing the last details. Be the first to know when we launch!",
    placeholder: "your@email.com",
    btn: "Notify me",
    done: "✓ Done!"
  }
};

function setLang(lang) {
  const c = content[lang];
  document.getElementById('main-title').firstChild.textContent = c.title;
  document.getElementById('subtitle').innerText = c.subtitle;
  document.getElementById('emailInput').placeholder = c.placeholder;
  document.getElementById('notifyBtn').innerText = c.btn;
  document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang;
  history.replaceState(null, '', `?lang=${lang}`);
}

const params = new URLSearchParams(window.location.search);
setLang(params.get('lang') === 'en' ? 'en' : 'fr');

function notifyMe() {
  const email = document.getElementById('emailInput').value;
  const lang = document.documentElement.lang;
  if (email && email.includes('@')) {
    document.getElementById('notifyBtn').innerText = content[lang].done;
    document.getElementById('emailInput').value = '';
  }
}
</script>
</body>
</html>
